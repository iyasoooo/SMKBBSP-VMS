name: CI

# The end-to-end job is the important one. It runs Playwright against a real
# production build in a real browser, which is the only check that catches
# hydration and Content-Security-Policy faults - `npm run build`, unit tests and
# curl all pass without executing a single line of client JavaScript.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Nothing credential-shaped belongs here. Workflow-level `env` is printed in
  # the environment block of *every* step's log, so a value placed here is
  # published dozens of times per run whether any step uses it or not.

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visitorpass
          POSTGRES_PASSWORD: visitorpass_local_dev
          POSTGRES_DB: visitorpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U visitorpass -d visitorpass"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Mask the throwaway database password
        # Defence in depth. The value is a disposable local credential that is
        # already public in docker-compose.yml, but masking keeps it out of
        # step logs so nobody has to judge that on sight.
        run: echo "::add-mask::visitorpass_local_dev"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`: the committed lockfile is generated on
      # Windows and lacks the Linux variants of sharp's optional @emnapi
      # dependencies, which `npm ci` treats as a fatal mismatch.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate ephemeral secrets
        # Real values are never needed in CI. These are random per run, so a
        # workflow log can never expose a secret that matters.
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "IDENTITY_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "IDENTITY_HMAC_KEY=$(openssl rand -base64 32)"
            echo "APP_URL=http://localhost:3000"
            echo "DATABASE_URL=postgresql://visitorpass:visitorpass_local_dev@localhost:5432/visitorpass?schema=public"
          } >> "$GITHUB_ENV"

      - run: npx prisma generate

      - name: Prepare the integration-test database
        # tests/setup.ts rewrites `visitorpass` to `visitorpass_test`, so that
        # database has to exist and be migrated before Vitest starts.
        env:
          DATABASE_URL: postgresql://visitorpass:visitorpass_local_dev@localhost:5432/visitorpass_test?schema=public
        run: npx prisma migrate deploy

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (production build, real browser)
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visitorpass
          POSTGRES_PASSWORD: visitorpass_local_dev
          POSTGRES_DB: visitorpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U visitorpass -d visitorpass"
          --health-interval 5s --health-timeout 5s --health-retries 12

      mailpit:
        # Present so the notification outbox delivers rather than recording a
        # connection failure; the suite asserts on database state, not on mail.
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']

    steps:
      - name: Mask the throwaway database password
        # Defence in depth. The value is a disposable local credential that is
        # already public in docker-compose.yml, but masking keeps it out of
        # step logs so nobody has to judge that on sight.
        run: echo "::add-mask::visitorpass_local_dev"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate ephemeral secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "IDENTITY_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "IDENTITY_HMAC_KEY=$(openssl rand -base64 32)"
            echo "APP_URL=http://127.0.0.1:3100"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=1025"
            echo "E2E_DATABASE_URL=postgresql://visitorpass:visitorpass_local_dev@localhost:5432/visitorpass_e2e?schema=public"
            echo "DATABASE_URL=postgresql://visitorpass:visitorpass_local_dev@localhost:5432/visitorpass_e2e?schema=public"
          } >> "$GITHUB_ENV"

      - run: npx prisma generate

      - name: Install the browser
        # Only chromium: both Playwright projects use it, and downloading the
        # others would add minutes for nothing.
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        # `npm run test:e2e` prepares and seeds visitorpass_e2e first, then
        # Playwright builds and starts the app on port 3100. CI sets
        # reuseExistingServer to false, so the server is always fresh.
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    # Only publish what has passed every gate, and only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Mask the throwaway database password
        # Defence in depth. The value is a disposable local credential that is
        # already public in docker-compose.yml, but masking keeps it out of
        # step logs so nobody has to judge that on sight.
        run: echo "::add-mask::visitorpass_local_dev"

      - uses: actions/checkout@v4

      - name: Resolve a lowercase image name
        # GHCR rejects uppercase, and this repository name contains capitals.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically; no personal access token is needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
